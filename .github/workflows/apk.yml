name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Sürümü oku
        id: surum
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk "Altyazi-v${{ steps.surum.outputs.v }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Altyazi-v${{ steps.surum.outputs.v }}
          path: Altyazi-v${{ steps.surum.outputs.v }}.apk

      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.surum.outputs.v }}
          name: Altyazı v${{ steps.surum.outputs.v }}
          files: Altyazi-v${{ steps.surum.outputs.v }}.apk
          body: |
            Telefon uygulaması (S25). APK'yı indirip kur.
            © Mehmet Karadeniz, 2026-2027
